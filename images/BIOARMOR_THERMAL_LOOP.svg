</defs><rect width="900" height="640" fill="#ffffff"/><text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#16324f">BioArmor Thermal Control Loop</text><rect x="345" y="40" width="240" height="68" rx="8" fill="#fce4d6" stroke="#33475b" stroke-width="1.5"/><text x="465" y="62" text-anchor="middle" font-size="14" font-weight="700" fill="#16324f">Variable-Emissivity Outer</text><text x="465" y="80" text-anchor="middle" font-size="11" fill="#444">low e cold / high e hot</text><rect x="630" y="40" width="210" height="68" rx="8" fill="#dbe7f3" stroke="#33475b" stroke-width="1.5"/><text x="735" y="62" text-anchor="middle" font-size="14" font-weight="700" fill="#16324f">Space (radiative)</text><text x="735" y="80" text-anchor="middle" font-size="11" fill="#444">sink + source</text><rect x="40" y="40" width="210" height="68" rx="8" fill="#fff2cc" stroke="#33475b" stroke-width="1.5"/><text x="145" y="62" text-anchor="middle" font-size="14" font-weight="700" fill="#16324f">PV Skin (power)</text><text x="145" y="80" text-anchor="middle" font-size="11" fill="#444">flexible perovskite</text><rect x="40" y="205" width="210" height="88" rx="8" fill="#d9ead3" stroke="#33475b" stroke-width="1.5"/><text x="145" y="227" text-anchor="middle" font-size="14" font-weight="700" fill="#16324f">Aerogel + Algae Shell</text><text x="145" y="245" text-anchor="middle" font-size="11" fill="#444">insulation</text><text x="145" y="260" text-anchor="middle" font-size="11" fill="#444">metabolic heat (free)</text><rect x="630" y="205" width="210" height="88" rx="8" fill="#dbe7f3" stroke="#33475b" stroke-width="1.5"/><text x="735" y="227" text-anchor="middle" font-size="14" font-weight="700" fill="#16324f">Coolant Loop + Radiator</text><text x="735" y="245" text-anchor="middle" font-size="11" fill="#444">active cooling</text><text x="735" y="260" text-anchor="middle" font-size="11" fill="#444">rejects to space</text><rect x="40" y="425" width="220" height="88" rx="8" fill="#f4cccc" stroke="#33475b" stroke-width="1.5"/><text x="150" y="447" text-anchor="middle" font-size="14" font-weight="700" fill="#16324f">CNT Heater Grid</text><text x="150" y="465" text-anchor="middle" font-size="11" fill="#444">active heating</text><text x="150" y="480" text-anchor="middle" font-size="11" fill="#444">from PV bus</text><rect x="345" y="510" width="220" height="80" rx="8" fill="#ead1f0" stroke="#33475b" stroke-width="1.5"/><text x="455" y="532" text-anchor="middle" font-size="14" font-weight="700" fill="#16324f">PCM Buffer</text><text x="455" y="550" text-anchor="middle" font-size="11" fill="#444">transient storage</text><rect x="630" y="425" width="220" height="88" rx="8" fill="#dfe6ee" stroke="#33475b" stroke-width="1.5"/><text x="740" y="447" text-anchor="middle" font-size="14" font-weight="700" fill="#16324f">Controller + Sensors</text><text x="740" y="465" text-anchor="middle" font-size="11" fill="#444">feedback loop</text><text x="740" y="480" text-anchor="middle" font-size="11" fill="#444">e, pump, heaters</text><rect x="375" y="255" width="170" height="115" rx="10" fill="#16324f" stroke="#0c1f30" stroke-width="2"/><text x="460" y="305" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Crew</text><text x="460" y="323" text-anchor="middle" font-size="11" fill="#cfe0ee">pressure cabin</text><line x1="585" y1="74" x2="630" y2="74" stroke="#c0392b" stroke-width="1.8" marker-start="url(#aR)" marker-end="url(#aR)"/><line x1="250" y1="249" x2="375" y2="300" stroke="#2e8b57" stroke-width="1.8" marker-start="url(#aR)" marker-end="url(#aR)"/><line x1="260" y1="425" x2="430" y2="372" stroke="#c0392b" stroke-width="1.8" marker-end="url(#aR)"/><line x1="545" y1="312" x2="630" y2="249" stroke="#2c6fbb" stroke-width="1.8" marker-end="url(#aB)"/><line x1="735" y1="205" x2="735" y2="108" stroke="#2c6fbb" stroke-width="1.8" marker-end="url(#aB)"/><line x1="455" y1="510" x2="460" y2="372" stroke="#2e8b57" stroke-width="1.8" marker-start="url(#aR)" marker-end="url(#aR)"/><polyline points="145,108 145,469 630,469" fill="none" stroke="#c0392b" stroke-width="1.8" marker-end="url(#aR)"/><line x1="660" y1="420" x2="585" y2="108" stroke="#7a7a7a" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#aG)"/><line x1="630" y1="455" x2="260" y2="455" stroke="#7a7a7a" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#aG)"/><line x1="660" y1="420" x2="735" y2="293" stroke="#7a7a7a" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#aG)"/><text x="40" y="624" font-size="11" fill="#555">Red = heat / power flow  -  Blue = cooling to space  -  Gray dashed = control (feedback)</text></svg>