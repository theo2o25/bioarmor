<svg xmlns="http://www.w3.org/2000/svg" width="860" height="640" viewBox="0 0 860 640" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#33475b"/></marker></defs><rect width="860" height="640" fill="#ffffff"/><text x="430" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#16324f">BioArmor Subsystem Overview</text><rect x="330" y="40" width="220" height="70" rx="8" fill="#cfe3f2" stroke="#33475b" stroke-width="1.5"/><text x="440" y="62" text-anchor="middle" font-size="14" font-weight="700" fill="#16324f">Breathing Loop</text><text x="440" y="80" text-anchor="middle" font-size="11" fill="#444">Helmet + regenerator</text><line x1="443.804347826087" y1="110" x2="459.021739130435" y2="250" stroke="#33475b" stroke-width="1.6" marker-end="url(#ah)"/><rect x="40" y="170" width="210" height="80" rx="8" fill="#d9ead3" stroke="#33475b" stroke-width="1.5"/><text x="145" y="192" text-anchor="middle" font-size="14" font-weight="700" fill="#16324f">O2 Supply</text><text x="145" y="210" text-anchor="middle" font-size="11" fill="#444">Compressed + chemical</text><line x1="250" y1="241.171875" x2="380" y2="279.765625" stroke="#33475b" stroke-width="1.6" marker-end="url(#ah)"/><rect x="610" y="170" width="210" height="100" rx="8" fill="#fce4d6" stroke="#33475b" stroke-width="1.5"/><text x="715" y="192" text-anchor="middle" font-size="14" font-weight="700" fill="#16324f">CO2 Removal</text><text x="715" y="210" text-anchor="middle" font-size="11" fill="#444">Algae bioreactor (supplemental)</text><text x="715" y="225" text-anchor="middle" font-size="11" fill="#444">+ LiOH / adsorbent (backup)</text><line x1="610" y1="255.7" x2="550" y2="276.1" stroke="#33475b" stroke-width="1.6" marker-end="url(#ah)"/><rect x="40" y="420" width="220" height="90" rx="8" fill="#fff2cc" stroke="#33475b" stroke-width="1.5"/><text x="150" y="442" text-anchor="middle" font-size="14" font-weight="700" fill="#16324f">Power</text><text x="150" y="460" text-anchor="middle" font-size="11" fill="#444">PV skin bus -&gt; heaters,</text><text x="150" y="475" text-anchor="middle" font-size="11" fill="#444">sensors, actuators</text><line x1="238.59375" y1="420" x2="380" y2="348.174603174603" stroke="#33475b" stroke-width="1.6" marker-end="url(#ah)"/><rect x="600" y="420" width="230" height="90" rx="8" fill="#ead1f0" stroke="#33475b" stroke-width="1.5"/><text x="715" y="442" text-anchor="middle" font-size="14" font-weight="700" fill="#16324f">Thermal Control</text><text x="715" y="460" text-anchor="middle" font-size="11" fill="#444">CNT heater &lt;-&gt; radiator</text><line x1="644.6875" y1="420" x2="550" y2="359.4" stroke="#33475b" stroke-width="1.6" marker-end="url(#ah)"/><rect x="330" y="520" width="220" height="80" rx="8" fill="#f4cccc" stroke="#33475b" stroke-width="1.5"/><text x="440" y="542" text-anchor="middle" font-size="14" font-weight="700" fill="#16324f">Impact Protection</text><text x="440" y="560" text-anchor="middle" font-size="11" fill="#444">Ceramic + CNT + aramid (EDS) + SMA</text><line x1="443.921568627451" y1="520" x2="459.607843137255" y2="360" stroke="#33475b" stroke-width="1.6" marker-end="url(#ah)"/><rect x="380" y="250" width="170" height="110" rx="10" fill="#16324f" stroke="#0c1f30" stroke-width="2"/><text x="465" y="310" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Crew</text><text x="465" y="327" text-anchor="middle" font-size="11" fill="#cfe0ee">sealed pressure cabin</text><text x="430" y="628" text-anchor="middle" font-size="11" fill="#7a7a7a">Algae tile layer provides SUPPLEMENTAL O2 / CO2 processing only; primary life support is compressed/chemical O2 and LiOH scrubbing.</text><rect x="40" y="300" width="220" height="90" rx="8" fill="#d6eaf8" stroke="#33475b" stroke-width="1.5"/><text x="150" y="332" text-anchor="middle" font-size="14" font-weight="700" fill="#16324f">Dust Protection</text><text x="150" y="350" text-anchor="middle" font-size="11" fill="#444">CNT-Aramid EDS weave</text><text x="150" y="366" text-anchor="middle" font-size="11" fill="#444">85-95% regolith repelled</text><line x1="260" y1="345" x2="380" y2="320" stroke="#33475b" stroke-width="1.6" marker-end="url(#ah)"/></svg>
