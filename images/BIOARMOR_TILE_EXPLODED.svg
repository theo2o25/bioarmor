<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" font-family="Segoe UI, Arial, sans-serif"><rect width="900" height="640" fill="#ffffff"/><text x="260" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#16324f">BioArmor Tile - Exploded Layer Stack (outer to inner)</text><text x="60" y="55" font-size="12" font-weight="700" fill="#16324f" transform="rotate(-90 60 55)">OUTER (space / impact side)</text><text x="860" y="55" font-size="12" font-weight="700" fill="#16324f" transform="rotate(90 860 55)">INNER (crew side)</text><polygon points="260,50 400,120 260,190 120,120" fill="#2b3a67" stroke="#16202b" stroke-width="1"/><polygon points="400,120 260,190 260,195 400,125" fill="#1f2a4a" stroke="#16202b" stroke-width="1"/><polygon points="120,120 260,190 260,195 120,125" fill="#182039" stroke="#16202b" stroke-width="1"/><line x1="400" y1="120" x2="548" y2="120" stroke="#888" stroke-width="1"/><text x="552" y="117" font-size="15" font-weight="700" fill="#16324f">Photovoltaic Skin</text><text x="552" y="134" font-size="12" fill="#555">t = 0.1 mm - Flexible perovskite PV</text><polygon points="260,95 400,165 260,235 120,165" fill="#c98f8f" stroke="#16202b" stroke-width="1"/><polygon points="400,165 260,235 260,247 400,177" fill="#916767" stroke="#16202b" stroke-width="1"/><polygon points="120,165 260,235 260,247 120,177" fill="#6f4f4f" stroke="#16202b" stroke-width="1"/><line x1="400" y1="165" x2="548" y2="165" stroke="#888" stroke-width="1"/><text x="552" y="162" font-size="15" font-weight="700" fill="#16324f">Ceramic Strike Plate</text><text x="552" y="179" font-size="12" fill="#555">t = 2 mm - Reaction-bonded SiC/Al2O3</text><polygon points="260,147 400,217 260,287 120,217" fill="#3c3c3c" stroke="#16202b" stroke-width="1"/><polygon points="400,217 260,287 260,292 400,222" fill="#2b2b2b" stroke="#16202b" stroke-width="1"/><polygon points="120,217 260,287 260,292 120,222" fill="#212121" stroke="#16202b" stroke-width="1"/><line x1="400" y1="217" x2="548" y2="217" stroke="#888" stroke-width="1"/><text x="552" y="214" font-size="15" font-weight="700" fill="#16324f">CNT Heater Grid</text><text x="552" y="231" font-size="12" fill="#555">t = 0.3 mm - Carbon-nanotube film</text><polygon points="260,192 400,262 260,332 120,262" fill="#d8c46a" stroke="#16202b" stroke-width="1"/><polygon points="400,262 260,332 260,338 400,268" fill="#9c8d4c" stroke="#16202b" stroke-width="1"/><polygon points="120,262 260,332 260,338 120,268" fill="#776c3a" stroke="#16202b" stroke-width="1"/><line x1="400" y1="262" x2="548" y2="262" stroke="#888" stroke-width="1"/><text x="552" y="259" font-size="15" font-weight="700" fill="#16324f">Surlyn Spall Liner</text><text x="552" y="276" font-size="12" fill="#555">t = 1 mm - Surlyn ionomer</text><polygon points="260,238 400,308 260,378 120,308" fill="#9fd8b0" stroke="#16202b" stroke-width="1"/><polygon points="400,308 260,378 260,414 400,344" fill="#729c7f" stroke="#16202b" stroke-width="1"/><polygon points="120,308 260,378 260,414 120,344" fill="#577761" stroke="#16202b" stroke-width="1"/><line x1="400" y1="308" x2="548" y2="308" stroke="#888" stroke-width="1"/><text x="552" y="305" font-size="15" font-weight="700" fill="#16324f">Aerogel + Algae Layer</text><text x="552" y="322" font-size="12" fill="#555">t = 6 mm - Silica aerogel + bioreactor</text><polygon points="260,314 400,384 260,454 120,384" fill="#7a5230" stroke="#16202b" stroke-width="1"/><polygon points="400,384 260,454 260,459 400,389" fill="#583b23" stroke="#16202b" stroke-width="1"/><polygon points="120,384 260,454 260,459 120,389" fill="#432d1a" stroke="#16202b" stroke-width="1"/><line x1="400" y1="384" x2="548" y2="384" stroke="#888" stroke-width="1"/><text x="552" y="381" font-size="15" font-weight="700" fill="#16324f">Aramid/UHMWPE Weave</text><text x="552" y="398" font-size="12" fill="#555">t = 0.5 mm - Aramid + UHMWPE</text><polygon points="260,359 400,429 260,499 120,429" fill="#8a8aa6" stroke="#16202b" stroke-width="1"/><polygon points="400,429 260,499 260,504 400,434" fill="#636378" stroke="#16202b" stroke-width="1"/><polygon points="120,429 260,499 260,504 120,434" fill="#4c4c5b" stroke="#16202b" stroke-width="1"/><line x1="400" y1="429" x2="548" y2="429" stroke="#888" stroke-width="1"/><text x="552" y="426" font-size="15" font-weight="700" fill="#16324f">SMA Actuator Grid</text><text x="552" y="443" font-size="12" fill="#555">t = 0.2 mm - NiTi shape-memory alloy</text><polygon points="260,404 400,474 260,544 120,474" fill="#b0c4de" stroke="#16202b" stroke-width="1"/><polygon points="400,474 260,544 260,549 400,479" fill="#7f8da0" stroke="#16202b" stroke-width="1"/><polygon points="120,474 260,544 260,549 120,479" fill="#616c7a" stroke="#16202b" stroke-width="1"/><line x1="400" y1="474" x2="548" y2="474" stroke="#888" stroke-width="1"/><text x="552" y="471" font-size="15" font-weight="700" fill="#16324f">Comfort / TC Layer</text><text x="552" y="488" font-size="12" fill="#555">t = 0.5 mm - Moisture-wicking thermal control</text><text x="450" y="624" text-anchor="middle" font-size="12" fill="#7a7a7a">Not to scale - thicknesses exaggerated for visibility; true values labeled per layer. Outer face faces space/impact.</text></svg>