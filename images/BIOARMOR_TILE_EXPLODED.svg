<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" font-family="Segoe UI, Arial, sans-serif"><rect width="900" height="640" fill="#ffffff"/><text x="260" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#16324f">BioArmor Tile - Exploded Layer Stack (outer to inner)</text><text x="60" y="55" font-size="12" font-weight="700" fill="#16324f" transform="rotate(-90 60 55)">OUTER (space / impact side)</text><text x="860" y="55" font-size="12" font-weight="700" fill="#16324f" transform="rotate(90 860 55)">INNER (crew side)</text><polygon points="260,50 400,120 260,190 120,120" fill="#2b3a67" stroke="#16202b" stroke-width="1"/><polygon points="400,120 260,190 260,195 400,125" fill="#1f2a4a" stroke="#16202b" stroke-width="1"/><polygon points="120,120 260,190 260,195 120,125" fill="#182039" stroke="#16202b" stroke-width="1"/><line x1="400" y1="120" x2="548" y2="120" stroke="#888" stroke-width="1"/><text x="552" y="117" font-size="15" font-weight="700" fill="#16324f">Photovoltaic Skin</text><text x="552" y="134" font-size="12" fill="#555">t = 0.1 mm - perovskite PV - power generation</text><polygon points="260,95 400,165 260,235 120,165" fill="#c98f8f" stroke="#16202b" stroke-width="1"/><polygon points="400,165 260,235 260,247 400,177" fill="#916767" stroke="#16202b" stroke-width="1"/><polygon points="120,165 260,235 260,247 120,177" fill="#6f4f4f" stroke="#16202b" stroke-width="1"/><line x1="400" y1="165" x2="548" y2="165" stroke="#888" stroke-width="1"/><text x="552" y="162" font-size="15" font-weight="700" fill="#16324f">Ceramic Strike Plate</text><text x="552" y="179" font-size="12" fill="#555">t = 2 mm - SiC/Al2O3 - impact / MMOD protection</text><polygon points="260,147 400,217 260,287 120,217" fill="#3c3c3c" stroke="#16202b" stroke-width="1"/><polygon points="400,217 260,287 260,292 400,222" fill="#2b2b2b" stroke="#16202b" stroke-width="1"/><polygon points="120,217 260,287 260,292 120,222" fill="#212121" stroke="#16202b" stroke-width="1"/><line x1="400" y1="217" x2="548" y2="217" stroke="#888" stroke-width="1"/><text x="552" y="214" font-size="15" font-weight="700" fill="#16324f">CNT Heater Grid</text><text x="552" y="231" font-size="12" fill="#555">t = 0.3 mm - CNT film in ceramic - energy transfer / power bus</text><polygon points="260,192 400,262 260,332 120,262" fill="#8a8aa6" stroke="#16202b" stroke-width="1"/><polygon points="400,262 260,332 260,337 400,267" fill="#636378" stroke="#16202b" stroke-width="1"/><polygon points="120,262 260,332 260,337 120,267" fill="#4c4c5b" stroke="#16202b" stroke-width="1"/><line x1="400" y1="262" x2="548" y2="262" stroke="#888" stroke-width="1"/><text x="552" y="259" font-size="15" font-weight="700" fill="#16324f">SMA Actuator Grid</text><text x="552" y="276" font-size="12" fill="#555">t = 0.2 mm - NiTi SMA - self-seal/morph (powered from above)</text><polygon points="260,237 400,307 260,377 120,307" fill="#7a5230" stroke="#16202b" stroke-width="1"/><polygon points="400,307 260,377 260,382 400,312" fill="#583b23" stroke="#16202b" stroke-width="1"/><polygon points="120,307 260,377 260,382 120,312" fill="#432d1a" stroke="#16202b" stroke-width="1"/><line x1="400" y1="307" x2="548" y2="307" stroke="#888" stroke-width="1"/><text x="552" y="304" font-size="15" font-weight="700" fill="#16324f">Aramid/UHMWPE Weave</text><text x="552" y="321" font-size="12" fill="#555">t = 0.5 mm - aramid + UHMWPE - tensile restraint</text><polygon points="260,282 400,352 260,422 120,352" fill="#d8c46a" stroke="#16202b" stroke-width="1"/><polygon points="400,352 260,422 260,428 400,358" fill="#9c8d4c" stroke="#16202b" stroke-width="1"/><polygon points="120,352 260,422 260,428 120,358" fill="#776c3a" stroke="#16202b" stroke-width="1"/><line x1="400" y1="352" x2="548" y2="352" stroke="#888" stroke-width="1"/><text x="552" y="349" font-size="15" font-weight="700" fill="#16324f">Surlyn Spall Liner</text><text x="552" y="366" font-size="12" fill="#555">t = 1 mm - Surlyn ionomer - spall capture + self-heal</text><polygon points="260,328 400,398 260,468 120,398" fill="#9fd8b0" stroke="#16202b" stroke-width="1"/><polygon points="400,398 260,468 260,504 400,434" fill="#729c7f" stroke="#16202b" stroke-width="1"/><polygon points="120,398 260,468 260,504 120,434" fill="#577761" stroke="#16202b" stroke-width="1"/><line x1="400" y1="398" x2="548" y2="398" stroke="#888" stroke-width="1"/><text x="552" y="395" font-size="15" font-weight="700" fill="#16324f">Aerogel + Algae Layer</text><text x="552" y="412" font-size="12" fill="#555">t = 6 mm - aerogel + Chlorella - insulation + suppl. O2/CO2</text><polygon points="260,404 400,474 260,544 120,474" fill="#b0c4de" stroke="#16202b" stroke-width="1"/><polygon points="400,474 260,544 260,549 400,479" fill="#7f8da0" stroke="#16202b" stroke-width="1"/><polygon points="120,474 260,544 260,549 120,479" fill="#616c7a" stroke="#16202b" stroke-width="1"/><line x1="400" y1="474" x2="548" y2="474" stroke="#888" stroke-width="1"/><text x="552" y="471" font-size="15" font-weight="700" fill="#16324f">Moisture-Wicking Layer</text><text x="552" y="488" font-size="12" fill="#555">t = 0.5 mm - comfort TC - wicks moisture to aerogel</text><text x="450" y="624" text-anchor="middle" font-size="12" fill="#7a7a7a">Not to scale - thicknesses exaggerated for visibility; true values labeled per layer. CNT sits in the ceramic plate; SMA is inboard to draw power; moisture-wicking layer feeds the aerogel.</text></svg>