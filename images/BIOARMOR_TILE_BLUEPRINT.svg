<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="v" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto" markerUnits="strokeWidth"><path d="M5,0 L10,8 L0,8 Z" fill="#33475b"/></marker></defs><rect width="900" height="620" fill="#ffffff"/><text x="450" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#16324f">BioArmor Tile - Reconfigured 2026-09 (outer to inner) — Polar Hardened</text><line x1="40" y1="80" x2="40" y2="530" stroke="#33475b" stroke-width="2" marker-end="url(#v)"/><text x="20" y="305" font-size="12" font-weight="700" fill="#16324f" transform="rotate(-90 20 305)">OUTER (space/impact)  ->  INNER (crew)</text><rect x="70" y="80" width="320" height="14" rx="3" fill="#2b3a67" stroke="#16202b" stroke-width="1"/><text x="405" y="84" font-size="15" font-weight="700" fill="#16324f">Photovoltaic Skin 33.6%</text><text x="405" y="101" font-size="12" fill="#555">t=0.1mm perovskite/Si tandem (ICO:H/IZO) 355mW pk 44.2mW avg 29.88% cert flex</text><rect x="70" y="110" width="320" height="44" rx="3" fill="#c98f8f" stroke="#16202b" stroke-width="1"/><text x="405" y="129" font-size="15" font-weight="700" fill="#16324f">Ceramic Strike Plate + VO2</text><text x="405" y="146" font-size="12" fill="#555">t=2mm SiC@SiO2/Al2O3 14mW/mK 24.7kN·m/kg 1200C + variable emissivity</text><rect x="70" y="170" width="320" height="14" rx="3" fill="#3c3c3c" stroke="#16202b" stroke-width="1"/><text x="405" y="174" font-size="15" font-weight="700" fill="#16324f">CNT Mesh + Supercap</text><text x="405" y="191" font-size="12" fill="#555">t=0.3mm woven CNT 5e6 S/m — structure + bus + EMI</text><rect x="70" y="200" width="320" height="14" rx="3" fill="#8a8aa6" stroke="#16202b" stroke-width="1"/><text x="405" y="204" font-size="15" font-weight="700" fill="#16324f">DEA Passive Cuff (opt)</text><text x="405" y="221" font-size="12" fill="#555">t=0.1mm DEA CNT/CB 29.6kPa 0.7s kHz BW</text><rect x="70" y="230" width="320" height="14" rx="3" fill="#7a5230" stroke="#16202b" stroke-width="1"/><text x="405" y="234" font-size="15" font-weight="700" fill="#16324f">ATSP Spiral EDS + UHMWPE/Aramid</text><text x="405" y="251" font-size="12" fill="#555">t=0.5mm+10µm ATSP/MWCNT/PTFE 0.3kV 90-97% spiral TPFS</text><rect x="70" y="260" width="320" height="22" rx="3" fill="#d8c46a" stroke="#16202b" stroke-width="1"/><text x="405" y="268" font-size="15" font-weight="700" fill="#16324f">BNNT Radiation Liner</text><text x="405" y="285" font-size="12" fill="#555">t=0.2mm BNNT-HDPE 50wt% 990% vs HDPE 15%>Al</text><rect x="70" y="298" width="320" height="22" rx="3" fill="#ffe08a" stroke="#16202b" stroke-width="1"/><text x="405" y="306" font-size="15" font-weight="700" fill="#16324f">sPUU Vitrimer Bladder</text><text x="405" y="323" font-size="12" fill="#555">t=1mm sPUU disulfide RT 77% + Surlyn sacrificial outer — O2-indep</text><rect x="70" y="336" width="320" height="110" rx="3" fill="#9fd8b0" stroke="#16202b" stroke-width="1"/><text x="405" y="385" font-size="15" font-weight="700" fill="#16324f">Ceramic NF Aerogel + Algae</text><text x="405" y="402" font-size="12" fill="#555">t=4mm BC-PVSQ/SiC@SiO2 14mW/mK -196 to 1200C 10k cycles</text><rect x="70" y="462" width="320" height="22" rx="3" fill="#b0c4de" stroke="#16202b" stroke-width="1"/><text x="405" y="470" font-size="15" font-weight="700" fill="#16324f">Comfort + SMA/hydrogel+TE</text><text x="405" y="487" font-size="12" fill="#555">t=0.5+0.2mm Lyocell + NiTi SMA 9.6C/4s hydrogel/TE</text><text x="450" y="540" text-anchor="middle" font-size="11" fill="#2e7d32" font-weight="700">Reconfigured: 23.39kg 8.81mm $10.16M (+1.7%/+1.6% vs 23kg $10M) — 18.4% mass /6.8% cost vs EMU 127kg $150M</text><text x="450" y="560" text-anchor="middle" font-size="11" fill="#7a7a7a">Not to scale — heights exaggerated; true thicknesses labeled. Incorporates KIST BNNT, Langley BNNT-HDPE, VCU ISS, sPUU, ATSP spiral, ceramic NF, 33.6% tandem.</text></svg>