<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="v" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto" markerUnits="strokeWidth"><path d="M5,0 L10,8 L0,8 Z" fill="#33475b"/></marker></defs><rect width="900" height="560" fill="#ffffff"/><text x="450" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#16324f">BioArmor Tile - Layer Stack (outer to inner)</text><line x1="40" y1="80" x2="40" y2="470" stroke="#33475b" stroke-width="2" marker-end="url(#v)"/><text x="20" y="275" font-size="12" font-weight="700" fill="#16324f" transform="rotate(-90 20 275)">OUTER (space/impact)  ->  INNER (crew)</text><rect x="70" y="80" width="320" height="14" rx="3" fill="#2b3a67" stroke="#16202b" stroke-width="1"/><text x="405" y="84" font-size="15" font-weight="700" fill="#16324f">Photovoltaic Skin</text><text x="405" y="101" font-size="12" fill="#555">t = 0.1 mm - perovskite PV - power generation</text><rect x="70" y="110" width="320" height="44" rx="3" fill="#c98f8f" stroke="#16202b" stroke-width="1"/><text x="405" y="129" font-size="15" font-weight="700" fill="#16324f">Ceramic Strike Plate</text><text x="405" y="146" font-size="12" fill="#555">t = 2 mm - SiC/Al2O3 - impact / MMOD protection</text><rect x="70" y="170" width="320" height="14" rx="3" fill="#3c3c3c" stroke="#16202b" stroke-width="1"/><text x="405" y="174" font-size="15" font-weight="700" fill="#16324f">CNT Heater Grid</text><text x="405" y="191" font-size="12" fill="#555">t = 0.3 mm - CNT film in ceramic - energy transfer / power bus</text><rect x="70" y="200" width="320" height="14" rx="3" fill="#8a8aa6" stroke="#16202b" stroke-width="1"/><text x="405" y="204" font-size="15" font-weight="700" fill="#16324f">SMA Actuator Grid</text><text x="405" y="221" font-size="12" fill="#555">t = 0.2 mm - NiTi SMA - self-seal/morph (powered from above)</text><rect x="70" y="230" width="320" height="14" rx="3" fill="#7a5230" stroke="#16202b" stroke-width="1"/><text x="405" y="234" font-size="15" font-weight="700" fill="#16324f">Aramid/UHMWPE Weave</text><text x="405" y="251" font-size="12" fill="#555">t = 0.5 mm - aramid + UHMWPE - tensile restraint</text><rect x="70" y="260" width="320" height="22" rx="3" fill="#d8c46a" stroke="#16202b" stroke-width="1"/><text x="405" y="268" font-size="15" font-weight="700" fill="#16324f">Surlyn Spall Liner</text><text x="405" y="285" font-size="12" fill="#555">t = 1 mm - Surlyn ionomer - spall capture + self-heal</text><rect x="70" y="298" width="320" height="132" rx="3" fill="#9fd8b0" stroke="#16202b" stroke-width="1"/><text x="405" y="361" font-size="15" font-weight="700" fill="#16324f">Aerogel + Algae Layer</text><text x="405" y="378" font-size="12" fill="#555">t = 6 mm - aerogel + Chlorella - insulation + suppl. O2/CO2</text><rect x="70" y="446" width="320" height="14" rx="3" fill="#b0c4de" stroke="#16202b" stroke-width="1"/><text x="405" y="450" font-size="15" font-weight="700" fill="#16324f">Moisture-Wicking Layer</text><text x="405" y="467" font-size="12" fill="#555">t = 0.5 mm - comfort TC - wicks moisture to aerogel</text><text x="450" y="540" text-anchor="middle" font-size="12" fill="#7a7a7a">Not to scale - heights exaggerated for visibility; true thicknesses labeled per layer.</text></svg>