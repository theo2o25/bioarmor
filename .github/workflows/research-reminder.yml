name: Quarterly Research Reminder

on:
  schedule:
    # Runs at 9:00 UTC on the 1st of Jan, Apr, Jul, Oct
    - cron: '0 9 1 1,4,7,10 *'
  workflow_dispatch:

jobs:
  create-research-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create Research Issue
        uses: actions/github-script@v7
        with:
          script: |
            const now = new Date();
            const quarter = Math.ceil((now.getMonth() + 1) / 3);
            const year = now.getFullYear();
            
            const body = `## Quarterly Research Update Q${quarter} ${year}
            
            Time to run the BioArmor technology research update.
            
            ### Steps
            
            1. **Open opencode** in this repository
            2. **Copy the 4 agent prompts** from \`docs/RESEARCH_PROCESS.md\`
            3. **Replace [MONTH YEAR]** with the current date
            4. **Run all 4 agents** in parallel
            5. **Compile results** into \`docs/RESEARCH_BRIEF_${now.toISOString().slice(0,7).replace('-','_')}.md\`
            6. **Update** \`BIOARMOR_CONCEPT.md\` and \`FUNDING.md\` with findings
            7. **Commit and push** changes
            
            ### Priority Items to Check
            
            - [ ] NASA SBIR deadlines and BAA status
            - [ ] NSF SBIR solicitation status  
            - [ ] CNT fiber pricing trends
            - [ ] Perovskite solar cell efficiency records
            - [ ] Self-healing polymer research updates
            - [ ] Algae bioreactor space experiments
            - [ ] AxEMU schedule updates
            - [ ] New grant opportunities
            
            ### Reference
            - Research process template: \`docs/RESEARCH_PROCESS.md\`
            - Last brief: \`docs/RESEARCH_BRIEF_2026.md\`
            `;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Research Update Q${quarter} ${year}`,
              body: body,
              labels: ['research', 'automated']
            });
